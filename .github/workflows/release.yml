name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: localization-packages-production
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify release tag
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || { echo "Tag must equal $expected" >&2; exit 1; }
      - name: Restore, build, and validate
        run: |
          dotnet restore Orbyss.Localization.slnx --locked-mode --configfile NuGet.config
          dotnet build Orbyss.Localization.slnx -c Release --no-restore
          python tests/validate_localization_contracts.py
          python tests/validate_localization_management.py
          python tests/validate_inmemory_storage.py
      - name: Pack package family
        run: dotnet pack Orbyss.Localization.slnx -c Release --no-build -p:PackageOutputPath="$PWD/artifacts/nuget"
      - name: Verify package family
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          [[ ${#packages[@]} -eq 11 ]] || { echo "Expected 11 Localization packages, found ${#packages[@]}." >&2; exit 1; }
          for package in "${packages[@]}"; do
            [[ "$(basename "$package")" == Orbyss.Localization* ]] || { echo "Unexpected package: $package" >&2; exit 1; }
          done
          python tests/validate_package_metadata.py --packages artifacts/nuget
      - name: Attest packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/nuget/*.nupkg
      - name: Authenticate with NuGet.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done
      - name: Verify public NuGet propagation
        run: python scripts/verify_nuget_publication.py --packages artifacts/nuget --timeout-seconds 900
