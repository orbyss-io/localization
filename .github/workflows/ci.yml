name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore and build
        run: |
          dotnet restore Orbyss.Localization.slnx --locked-mode --configfile NuGet.config
          dotnet build Orbyss.Localization.slnx -c Release --no-restore
      - name: Validate Localization contracts
        run: |
          python tests/validate_localization_contracts.py
          python tests/validate_localization_management.py
          python tests/validate_inmemory_storage.py
      - name: Pack Localization family
        shell: bash
        run: |
          dotnet pack Orbyss.Localization.slnx -c Release --no-build -p:PackageOutputPath="$PWD/artifacts/nuget"
          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          [[ ${#packages[@]} -eq 11 ]] || { echo "Expected 11 Localization packages, found ${#packages[@]}." >&2; exit 1; }
          for package in "${packages[@]}"; do
            [[ "$(basename "$package")" == Orbyss.Localization.* ]] || { echo "Unexpected package: $package" >&2; exit 1; }
          done
          python tests/validate_package_metadata.py --packages artifacts/nuget
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orbyss-localization-${{ github.sha }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
